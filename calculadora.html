
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Samuel</title>

    <link rel="stylesheet" href="caculadoraEstilos.css">
    <script src="calculadoraApp.js" defer></script>
</head>
<body>

    <h1>Calculadora</h1>

    <form id="calculadora" novalidate>

        <fieldset>
            <legend>Operaciones</legend>

            <!-- Introducimos el primer numero -->
            <label for="numero1">Primer número:</label>
            <input type="number" id="numero1" name="numero1" step="any"><br><br>

            <!-- Seleccionamos la operacion-->
            <label for="operacion">Operación:</label>

            <select id="operacion" name="operacion">
                <option value="suma">Sumar</option>
                <option value="resta">Restar</option>
                <option value="multiplicacion">Multiplicar</option>
                <option value="division">Dividir</option>
                <option value="potencia">Potencia</option>
                <option value="resto">Resto</option>
            </select><br><br>

            <!-- Introducimos el segundo numero -->
            <label for="numero2">Segundo número:</label>
            <input type="number" id="numero2" name="numero2" step="any"><br><br>

            <!-- Botones para calcular y limpiar -->
            <button type="submit">Calcular</button>
            <button type="button" id="limpiar">Limpiar</button>

        </fieldset>

    </form>

    <!-- Aqui mostraremos los errores (en el caso de que haya) y el resultado (el cual se mostrara vacio si existe mesnaje de error)-->
    <p id="error"></p>
    <p id="resultado"></p>

</body>
</html>
